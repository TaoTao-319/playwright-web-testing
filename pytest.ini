[pytest]
testpaths =
    tests/test_login.py
    tests/test_inventory.py
    tests/test_cart.py
    tests/test_checkout.py
addopts = -v --browser chromium --screenshot only-on-failure --tracing retain-on-failure --output test-results/regression --html=reports/report.html --self-contained-html --junitxml=reports/results.xml
